name: 构建主应用镜像

on:
  workflow_dispatch:


jobs:
  pre-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl git make build-essential bash zlib1g-dev ca-certificates
        wget https://golang.org/dl/go1.23.9.linux-amd64.tar.gz
        sudo tar -C /usr/local -xvzf go1.23.9.linux-amd64.tar.gz
        echo "export PATH=\$PATH:/usr/local/go/bin" >> ~/.bashrc
        source ~/.bashrc
        go version

    - name: Build apple-music-downloader (zhaarey)
      run: |
        git clone https://github.com/zhaarey/apple-music-downloader.git
        cd ${GITHUB_WORKSPACE}/apple-music-downloader
        
        # 同时编译 amd64 与 arm64
        mkdir -p ${GITHUB_WORKSPACE}/output
        for ARCH in amd64 arm64; do
          echo "==> Building for $ARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -a -o dl-$ARCH main.go
          mv dl-$ARCH ${GITHUB_WORKSPACE}/output/
        done
        cp config.yaml ${GITHUB_WORKSPACE}/output/

    - name: Build apple-music-downloader (sky8282)
      run: |
        mkdir -p ./sky
        cd ${GITHUB_WORKSPACE}/sky
        git clone https://github.com/chas0000/apple-music-downloader-muilt.git
        cd ${GITHUB_WORKSPACE}/sky/apple-music-downloader-muilt
        sed -i 's|config.yaml|sky_config.yaml|g' ./main.go
        sed -i 's|config.yaml|sky_config.yaml|g' ./internal/core/state.go
        go mod tidy
        mkdir -p ${GITHUB_WORKSPACE}/output/
        for ARCH in amd64 arm64; do
          echo "==> Building sky version for $ARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -a -o sdl-$ARCH main.go
          mv sdl-$ARCH ${GITHUB_WORKSPACE}/output/
        done
        cp config.yaml ${GITHUB_WORKSPACE}/output/sky_config.yaml

    - name: Download ttyd (multi-arch)
      run: |
        apt update && apt install wget curl -y
        mkdir -p ${GITHUB_WORKSPACE}/output
        for ARCH in amd64 arm64; do
          if [ "$ARCH" = "amd64" ]; then DLARCH="x86_64"; else DLARCH="aarch64"; fi
          echo "==> Downloading ttyd for $ARCH ($DLARCH)"
          URL=$(curl -s https://api.github.com/repos/tsl0922/ttyd/releases/latest | grep browser_download_url | grep "$DLARCH" | cut -d '"' -f 4 | head -n 1)
          wget "$URL" -O ${GITHUB_WORKSPACE}/output/ttyd-$ARCH
          chmod +x ${GITHUB_WORKSPACE}/output/ttyd-$ARCH
        done
        
    - name: List output files
      run: |
        ls -lR ${GITHUB_WORKSPACE}/output
    - name: Move files    
      run: |
        ls -lR ${GITHUB_WORKSPACE}/output
        mkdir -p ${GITHUB_WORKSPACE}/backup/
        mv ${GITHUB_WORKSPACE}/output/config.yaml ${GITHUB_WORKSPACE}/backup/config.yaml
        mv ${GITHUB_WORKSPACE}/output/sky_config.yaml ${GITHUB_WORKSPACE}/backup/sky_config.yaml
        ls -l ${GITHUB_WORKSPACE}/backup
  
    - name: Upload AMDL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: amdl-output
        path: |
          ${{ github.workspace }}/output


          
    - name: Upload Go build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: config-output
        path: |
          ${{ github.workspace }}/backup

    - name: Create release archives
      run: |
        set -eux
        mkdir -p ${GITHUB_WORKSPACE}/release
        
        # 创建 amd64 架构包
        mkdir -p ${GITHUB_WORKSPACE}/release/amdl-amd64
        cp ${GITHUB_WORKSPACE}/output/dl-amd64 ${GITHUB_WORKSPACE}/release/amdl-amd64/dl
        cp ${GITHUB_WORKSPACE}/output/sdl-amd64 ${GITHUB_WORKSPACE}/release/amdl-amd64/sdl
        cp ${GITHUB_WORKSPACE}/output/config.yaml ${GITHUB_WORKSPACE}/release/amdl-amd64/config.yaml
        cp ${GITHUB_WORKSPACE}/output/sky_config.yaml ${GITHUB_WORKSPACE}/release/amdl-amd64/sky_config.yaml
        cd ${GITHUB_WORKSPACE}/release
        tar czf amdl-amd64.tar.gz amdl-amd64/
        
        # 创建 arm64 架构包
        mkdir -p ${GITHUB_WORKSPACE}/release/amdl-arm64
        cp ${GITHUB_WORKSPACE}/output/dl-arm64 ${GITHUB_WORKSPACE}/release/amdl-arm64/dl
        cp ${GITHUB_WORKSPACE}/output/sdl-arm64 ${GITHUB_WORKSPACE}/release/amdl-arm64/sdl
        cp ${GITHUB_WORKSPACE}/output/config.yaml ${GITHUB_WORKSPACE}/release/amdl-arm64/config.yaml
        cp ${GITHUB_WORKSPACE}/output/sky_config.yaml ${GITHUB_WORKSPACE}/release/amdl-arm64/sky_config.yaml
        cd ${GITHUB_WORKSPACE}/release
        tar czf amdl-arm64.tar.gz amdl-arm64/
        
        echo "Release archives created:"
        ls -lh ${GITHUB_WORKSPACE}/release/*.tar.gz

    - name: Upload release archives
      uses: actions/upload-artifact@v4
      with:
        name: release-archives
        path: |
          ${{ github.workspace }}/release/*.tar.gz


   # 构建 amd64 镜像
  build-amd64:
    needs: pre-build
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.set_build_date.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download output
        uses: actions/download-artifact@v4
        with:
          name: amdl-output
          path: ./output
      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: config-output
          path: ./backup
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set BUILD_DATE
        id: set_build_date
        run: |
          export TZ='Asia/Shanghai'
          BUILD_DATE=$(date +'%Y%m%d%H%M')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/amdl_m:test-amd64-${{ env.BUILD_DATE }}
            ghcr.io/${{ github.actor }}/amdl_m:test-amd64-${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_m:amd64-cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_m:amd64-cache,mode=max

   # 构建 arm64 镜像
  build-arm64:
    needs: pre-build
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.set_build_date.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download output
        uses: actions/download-artifact@v4
        with:
          name: amdl-output
          path: ./output
      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: config-output
          path: ./backup

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set BUILD_DATE
        id: set_build_date
        run: |
          export TZ='Asia/Shanghai'
          BUILD_DATE=$(date +'%Y%m%d%H%M')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/amdl_m:test-arm64-${{ env.BUILD_DATE }}
            ghcr.io/${{ github.actor }}/amdl_m:test-arm64-${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_m:arm64-cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_m:arm64-cache,mode=max

   # 合并 multi-arch 镜像
  create-multiarch:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push
        run: |
          BUILD_DATE_AMD64=${{ needs.build-amd64.outputs.build_date }}
          BUILD_DATE_ARM64=${{ needs.build-arm64.outputs.build_date }}

          # Docker Hub
          docker buildx imagetools create -t ${{ secrets.DOCKER_USERNAME }}/amdl_m:test \
            ${{ secrets.DOCKER_USERNAME }}/amdl_m:test-amd64-${BUILD_DATE_AMD64} \
            ${{ secrets.DOCKER_USERNAME }}/amdl_m:test-arm64-${BUILD_DATE_ARM64}

          # GHCR
          docker buildx imagetools create -t ghcr.io/${{ github.actor }}/amdl_m:test \
            ghcr.io/${{ github.actor }}/amdl_m:test-amd64-${BUILD_DATE_AMD64} \
            ghcr.io/${{ github.actor }}/amdl_m:test-arm64-${BUILD_DATE_ARM64}

      - name: Build Summary
        run: |
          echo "## ✅ 主应用镜像构建成功 (测试版)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建时间**: ${{ needs.build-amd64.outputs.build_date }} / ${{ needs.build-arm64.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签 (测试版)**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_m:test\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_m:test-amd64-${{ needs.build-amd64.outputs.build_date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_m:test-arm64-${{ needs.build-arm64.outputs.build_date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_m:test\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_m:test-amd64-${{ needs.build-amd64.outputs.build_date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_m:test-arm64-${{ needs.build-arm64.outputs.build_date }}\`" >> $GITHUB_STEP_SUMMARY

  # 创建 GitHub Release
  create-release:
    runs-on: ubuntu-latest
    needs: [pre-build, create-multiarch]
    if: github.ref == 'refs/heads/main'  # 只在 main 分支创建 Release
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: ./release

      - name: Generate release tag
        id: tag
        run: |
          export TZ='Asia/Shanghai'
          RELEASE_TAG="v$(date +'%Y%m%d%H%M')"
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AMDL Release ${{ steps.tag.outputs.tag }}
          body: |
            ## AMDL Binary Release
            
            ### 包含内容
            - dl: apple-music-downloader (zhaarey 版本)
            - sdl: apple-music-downloader (sky8282 多线版本)
            - config.yaml: dl 的配置文件
            - sky_config.yaml: sdl 的配置文件
            
            ### 架构
            - amdl-amd64.tar.gz: amd64 架构
            - amdl-arm64.tar.gz: arm64 架构
            
            ### 使用方法
            ```bash
            # 解压
            tar xzf amdl-amd64.tar.gz  # 或 amdl-arm64.tar.gz
            cd amdl-amd64  # 或 amdl-arm64
            
            # 运行
            ./dl    # zhaarey 版本
            ./sdl   # sky8282 多线版本
            ```
          files: |
            ./release/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
