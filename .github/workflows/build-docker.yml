name: 发布容器

on:
  #push:
  #  branches:
  #    - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的 ubuntu runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl git make build-essential bash zlib1g-dev ca-certificates
        wget https://golang.org/dl/go1.23.9.linux-amd64.tar.gz
        sudo tar -C /usr/local -xvzf go1.23.9.linux-amd64.tar.gz
        echo "export PATH=\$PATH:/usr/local/go/bin" >> ~/.bashrc
        source ~/.bashrc
        go version

    - name: Build apple-music-downloader (zhaarey)
      run: |
        git clone https://github.com/zhaarey/apple-music-downloader.git
        cd ${GITHUB_WORKSPACE}/apple-music-downloader
        
        # 同时编译 amd64 与 arm64
        mkdir -p ${GITHUB_WORKSPACE}/output
        for ARCH in amd64 arm64; do
          echo "==> Building for $ARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -a -o dl-$ARCH main.go
          mv dl-$ARCH ${GITHUB_WORKSPACE}/output/
        done
        cp config.yaml ${GITHUB_WORKSPACE}/output/

    - name: Build apple-music-downloader (sky8282)
      run: |
        mkdir -p ./sky
        cd ${GITHUB_WORKSPACE}/sky
        git clone https://github.com/sky8282/apple-music-downloader.git
        cd ${GITHUB_WORKSPACE}/sky/apple-music-downloader
        sed -i 's|config.yaml|sky_config.yaml|g' ./main.go
        sed -i 's|config.yaml|sky_config.yaml|g' ./internal/core/state.go

        mkdir -p ${GITHUB_WORKSPACE}/output/
        for ARCH in amd64 arm64; do
          echo "==> Building sky version for $ARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -a -o sdl-$ARCH main.go
          mv sdl-$ARCH ${GITHUB_WORKSPACE}/output/
        done
        cp config.yaml ${GITHUB_WORKSPACE}/output/sky_config.yaml

    - name: Download ttyd (multi-arch)
      run: |
        apt update && apt install wget curl -y
        mkdir -p ${GITHUB_WORKSPACE}/output
        for ARCH in amd64 arm64; do
          if [ "$ARCH" = "amd64" ]; then DLARCH="x86_64"; else DLARCH="aarch64"; fi
          echo "==> Downloading ttyd for $ARCH ($DLARCH)"
          URL=$(curl -s https://api.github.com/repos/tsl0922/ttyd/releases/latest | grep browser_download_url | grep "$DLARCH" | cut -d '"' -f 4 | head -n 1)
          wget "$URL" -O ${GITHUB_WORKSPACE}/output/ttyd-$ARCH
          chmod +x ${GITHUB_WORKSPACE}/output/ttyd-$ARCH
        done

    - name: List output files
      run: |
        ls -lR ${GITHUB_WORKSPACE}/output

    - name: Upload AMDL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: amdl-output
        path: |
          ${{ github.workspace }}/output

    - name: git_MP4box
      run: |
        apt update && apt install build-essential pkg-config g++ git cmake yasm zlib1g-dev -y
        git clone https://github.com/gpac/gpac.git gpac_public
        cd gpac_public
        ./configure --static-bin
        make -j$(nproc)
        ls -l ./bin/gcc
        mv ./bin/gcc/MP4Box ${GITHUB_WORKSPACE}
        ls -l ${GITHUB_WORKSPACE}

    - name: Upload Go build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MP4Box-output
        path: |
          ${{ github.workspace }}/MP4Box

    - name: Move files    
      run: |
        ls -lR ${GITHUB_WORKSPACE}/output
        mkdir -p ${GITHUB_WORKSPACE}/backup/
        mv ${GITHUB_WORKSPACE}/output/config.yaml ${GITHUB_WORKSPACE}/backup/config.yaml
        mv ${GITHUB_WORKSPACE}/output/sky_config.yaml ${GITHUB_WORKSPACE}/backup/sky_config.yaml
        ls -l ${GITHUB_WORKSPACE}/backup

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current date
      run: export TZ='Asia/Shanghai' && echo "BUILD_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

    - name: Build and push Docker images (multi-arch)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/amdl-docker:latest
          ${{ secrets.DOCKER_USERNAME }}/amdl-docker:${{ env.BUILD_DATE }}
          ghcr.io/${{ github.repository_owner }}/amdl-docker:latest
          ghcr.io/${{ github.repository_owner }}/amdl-docker:${{ env.BUILD_DATE }}
