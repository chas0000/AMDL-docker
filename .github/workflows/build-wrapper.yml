name: 构建 Wrapper 基础镜像

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.wrapper'
      - '.github/workflows/build-wrapper.yml'

jobs:
  build-wrapper-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set BUILD_DATE
        id: set_build_date
        run: |
          export TZ='Asia/Shanghai'
          BUILD_DATE=$(date +'%Y%m%d%H%M')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build and push wrapper base image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.wrapper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:latest
            ${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:${{ env.BUILD_DATE }}
            ghcr.io/${{ github.actor }}/amdl_wrapper:latest
            ghcr.io/${{ github.actor }}/amdl_wrapper:${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:cache,mode=max

      - name: Build Summary
        run: |
          echo "## ✅ Wrapper 基础镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建时间**: ${{ env.BUILD_DATE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_wrapper:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_wrapper:${{ env.BUILD_DATE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_wrapper:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_wrapper:${{ env.BUILD_DATE }}\`" >> $GITHUB_STEP_SUMMARY
