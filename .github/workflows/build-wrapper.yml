name: 构建 Wrapper 基础镜像

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/split-docker-workflows ]
    paths:
      - 'Dockerfile.wrapper'
      - '.github/workflows/build-wrapper.yml'

jobs:
  pre-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git make build-essential bash zlib1g-dev ca-certificates
          wget https://golang.org/dl/go1.23.9.linux-amd64.tar.gz
          sudo tar -C /usr/local -xvzf go1.23.9.linux-amd64.tar.gz
          echo "export PATH=\$PATH:/usr/local/go/bin" >> ~/.bashrc
          source ~/.bashrc
          go version

      - name: Build wrapper-manager-v1 (multi-arch)
        run: |
          git clone --depth=1 https://github.com/sky8282/wrapper-manager-v1.git
          cd wrapper-manager-v1
          go mod init wrapper-manager
          go mod tidy
          mkdir -p ${GITHUB_WORKSPACE}/output
          mkdir -p ${GITHUB_WORKSPACE}/backup
          cp index.html ${GITHUB_WORKSPACE}/output/index.html
          cp config.yaml ${GITHUB_WORKSPACE}/backup/wm_config.yaml
          for ARCH in amd64 arm64; do
            echo "==> Building wm_server for $ARCH"
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -a -o wm_server-$ARCH main.go
            mv wm_server-$ARCH ${GITHUB_WORKSPACE}/output/
          done

      - name: Upload wrapper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-output
          path: |
            ${{ github.workspace }}/output
            ${{ github.workspace }}/backup

  build-wrapper-base:
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download wrapper artifacts
        uses: actions/download-artifact@v4
        with:
          name: wrapper-output
          path: ./

      - name: Verify files
        run: |
          echo "=== Output directory ==="
          ls -la ./output/ || echo "output dir not found"
          echo "=== Backup directory ==="
          ls -la ./backup/ || echo "backup dir not found"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set BUILD_DATE
        id: set_build_date
        run: |
          export TZ='Asia/Shanghai'
          BUILD_DATE=$(date +'%Y%m%d%H%M')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build and push wrapper base image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.wrapper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:test
            ${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:test-${{ env.BUILD_DATE }}
            ghcr.io/${{ github.actor }}/amdl_wrapper:test
            ghcr.io/${{ github.actor }}/amdl_wrapper:test-${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/amdl_wrapper:cache,mode=max

      - name: Build Summary
        run: |
          echo "## ✅ Wrapper 基础镜像构建成功 (测试版)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建时间**: ${{ env.BUILD_DATE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签 (测试版)**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_wrapper:test\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`chaslllll/amdl_wrapper:test-${{ env.BUILD_DATE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_wrapper:test\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.actor }}/amdl_wrapper:test-${{ env.BUILD_DATE }}\`" >> $GITHUB_STEP_SUMMARY
